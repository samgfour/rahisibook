<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard — RahisiBook</title>
  <meta name="description" content="RahisiBook salon dashboard demo.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23EF9F27'/%3E%3Cpath d='M12 20.5 17.5 26 28 14' stroke='%2327500A' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    .dashboard-shell{min-height:100vh}.dashboard-header{border-bottom:1px solid var(--border);background:var(--white)}.dashboard-header .wrap{height:72px;display:flex;align-items:center;justify-content:space-between}.dashboard-actions{display:flex;gap:10px;align-items:center}.dashboard-main{padding:48px 0}.dashboard-title{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}.dashboard-title h1{font-size:clamp(2rem,4vw,3rem);margin-bottom:6px}.dashboard-title p{color:var(--muted)}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}.metric-card,.panel{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:22px}.metric-card{display:flex;justify-content:space-between;gap:12px}.metric-card span{display:block;color:var(--muted);font-size:.85rem}.metric-card strong{display:block;font-size:1.8rem;margin-top:4px}.metric-card i{color:var(--green);font-size:1.5rem}.dashboard-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:20px}.panel-header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.panel-header h2{font:600 1.25rem var(--font-body)}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select,.filters input{border:1px solid var(--border);background:var(--bg);color:var(--ink);padding:9px;border-radius:7px}.appointment-list{display:grid;gap:10px}.appointment{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:14px;padding:14px;background:var(--bg);border-radius:8px}.appointment-time{font-weight:600}.appointment-details{display:flex;flex-direction:column}.appointment-details small{color:var(--muted)}.appointment-actions{display:flex;align-items:center;gap:6px}.status{font-size:.75rem;border-radius:100px;padding:4px 9px;font-weight:600}.status-confirmed{background:#d9f2d1;color:var(--green)}.status-pending{background:#fff0c8;color:#76520a}.status-cancelled{background:#f9dada;color:#8d2424}.icon-action{border:0;background:transparent;color:var(--muted);padding:6px}.empty-state{text-align:center;color:var(--muted);padding:36px}.chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding:20px 4px 0;border-bottom:1px solid var(--border)}.bar{flex:1;min-height:8px;background:var(--gold);border-radius:5px 5px 0 0;position:relative}.bar span{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:.72rem;color:var(--muted)}.dashboard-note{color:var(--muted);font-size:.85rem;margin-top:22px}.toast{position:fixed;right:20px;bottom:20px;background:var(--green);color:#fff;padding:13px 17px;border-radius:8px;box-shadow:0 5px 20px #0003;display:none;z-index:40}.toast.show{display:block}@media(max-width:900px){.metric-grid{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}}@media(max-width:600px){.dashboard-header .wrap{height:auto;min-height:72px;padding-top:12px;padding-bottom:12px;align-items:flex-start}.dashboard-actions .btn{font-size:.8rem;padding:0 12px}.dashboard-title{display:block}.dashboard-title .btn{margin-top:16px}.metric-grid{grid-template-columns:1fr 1fr}.appointment{grid-template-columns:54px 1fr}.appointment-actions{grid-column:2;justify-content:flex-start}.filters>*{width:100%}}
  </style>
</head>
<body>
  <header class="dashboard-header"><div class="wrap">
    <a class="logo" href="index.html"><span class="logo-mark">✓</span>RahisiBook</a>
    <div class="dashboard-actions"><a class="btn btn-secondary" href="index.html"><i class="ti ti-arrow-left"></i> Website</a><button class="btn btn-primary" id="export-btn" type="button"><i class="ti ti-download"></i> Export</button></div>
  </div></header>
  <main class="dashboard-main"><div class="wrap">
    <div class="dashboard-title"><div><span class="eyebrow">Demo workspace</span><h1>Good morning, Grace.</h1><p id="dashboard-date"></p></div><button class="btn btn-primary" id="new-booking" type="button"><i class="ti ti-plus"></i> New booking</button></div>
    <section class="metric-grid" aria-label="Business overview"><article class="metric-card"><div><span>Today’s bookings</span><strong id="metric-bookings">0</strong></div><i class="ti ti-calendar-check"></i></article><article class="metric-card"><div><span>Expected revenue</span><strong id="metric-revenue">KES 0</strong></div><i class="ti ti-cash"></i></article><article class="metric-card"><div><span>Pending payments</span><strong id="metric-pending">0</strong></div><i class="ti ti-clock"></i></article><article class="metric-card"><div><span>Repeat clients</span><strong>68%</strong></div><i class="ti ti-users"></i></article></section>
    <div class="dashboard-grid"><section class="panel"><div class="panel-header"><h2>Today’s appointments</h2><div class="filters"><input id="search" type="search" placeholder="Search client" aria-label="Search client"><select id="status-filter" aria-label="Filter by status"><option value="all">All statuses</option><option value="confirmed">Confirmed</option><option value="pending">Pending</option><option value="cancelled">Cancelled</option></select></div></div><div class="appointment-list" id="appointment-list"></div></section><section class="panel"><div class="panel-header"><h2>Weekly revenue</h2><span class="status status-confirmed">+18%</span></div><div class="chart" id="revenue-chart" aria-label="Weekly revenue chart"></div><p class="dashboard-note">A sample dashboard for the RahisiBook product demo. Connect a secure backend before using real customer data.</p></section></div>
  </div></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="dashboard.js" defer></script>
</body>
</html>
